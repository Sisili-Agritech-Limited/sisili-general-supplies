name: Rebuild site

# HostAfrica's cPanel Git Version Control clones this repo directly into the
# domain's document root, with no Node.js to run build.mjs on pull — so the
# generated HTML (index.html, about/, assets/, ...) has to already be sitting
# at the repo root, committed, ahead of time. This keeps it in sync
# automatically instead of relying on remembering to build before every push.
on:
  push:
    branches: [main]

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip build]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node build.mjs --root

      - name: Commit generated site if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: rebuild site [skip build]"
          git push
