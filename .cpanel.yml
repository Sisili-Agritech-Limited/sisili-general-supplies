---
# cPanel Git Version Control deployment task. Runs when you click
# "Deploy HEAD Commit" (or via an auto-deploy webhook) after a pull.
# Copies the pre-built dist/ (committed to the repo by the "Rebuild dist"
# GitHub Action) into the live document root for sisilisupplies.co.ke.
#
# If deployment fails or serves the wrong content, verify this path against
# cPanel -> Domains -> sisilisupplies.co.ke -> Document Root, and hardcode
# the absolute path here in place of $HOME if it doesn't match.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/domains/sisilisupplies.co.ke/public_html/
    - /bin/cp -R dist/* $DEPLOYPATH
